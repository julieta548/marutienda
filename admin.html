<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#CDEFD9">
<meta name="robots" content="noindex">
<title>Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header style="padding:28px 0 0"><h1>Panel</h1></header>

  <section id="login" class="panel hidden">
    <h2>Ingresar</h2>
    <div class="form" style="margin-top:12px">
      <div class="full"><label for="em">Email</label><input id="em" type="email" autocomplete="username"></div>
      <div class="full"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
      <button id="entrar" class="full">Ingresar</button>
      <p id="lerr" class="err full"></p>
    </div>
  </section>

  <div id="app" class="hidden">
    <section class="panel">
      <h2>Subir prenda</h2>
      <div class="form" style="margin-top:12px">
        <div class="full"><label for="fotos">Fotos (podés elegir varias)</label><input id="fotos" type="file" accept="image/*" multiple></div>
        <div class="full"><label for="titulo">Título</label><input id="titulo" placeholder="Ej: Campera de jean"></div>
        <div><label for="categoria">Categoría</label><input id="categoria" placeholder="Remeras, jeans..."></div>
        <div><label for="talle">Talle</label><input id="talle"></div>
        <div><label for="color">Color</label><input id="color"></div>
        <div><label for="precio">Precio de venta ($)</label><input id="precio" type="number" inputmode="numeric"></div>
        <div class="full"><label for="descripcion">Descripción</label><textarea id="descripcion" rows="2"></textarea></div>
        <h3 class="full" style="margin-top:6px">Datos internos (no se publican)</h3>
        <div><label for="local">Local de origen</label>
          <select id="local"></select>
          <input id="nuevoLocal" class="hidden" placeholder="Nombre del local nuevo" style="margin-top:6px"></div>
        <div><label for="costo">Costo ($)</label><input id="costo" type="number" inputmode="numeric"></div>
        <div class="full"><label for="grupo">Grupo de mayoristas donde la viste</label><input id="grupo"></div>
        <div class="full"><label for="notas">Notas</label><textarea id="notas" rows="2"></textarea></div>
        <button id="guardar" class="full">Publicar prenda</button>
        <p id="gmsg" class="full mut"></p>
      </div>
    </section>

    <section class="panel">
      <h2>Resumen por local</h2>
      <div class="filters" style="margin-top:12px"><select id="rper" aria-label="Período de ventas">
        <option value="todo">Ventas de todo el tiempo</option><option value="mes">Ventas de este mes</option></select></div>
      <div style="overflow-x:auto"><table id="resumen"></table></div>
      <p class="mut">La ganancia solo cuenta las prendas vendidas que tienen costo cargado.</p>
    </section>

    <section class="panel">
      <h2>Mis prendas</h2>
      <div class="filters" style="margin-top:12px">
        <select id="flocal" aria-label="Filtrar por local"><option value="">Todos los locales</option></select>
        <select id="festado" aria-label="Filtrar por estado">
          <option value="">Todos los estados</option><option>disponible</option><option>reservado</option><option>vendido</option>
        </select>
      </div>
      <div id="lista"></div>
    </section>
    <button id="salir" class="sec">Cerrar sesión</button>
    <p style="margin:24px 0"><a href="index.html">Ver catálogo público</a></p>
  </div>
</main>

<dialog id="edlg"><div class="dlg">
  <h2>Editar prenda</h2>
  <p class="mut">Tocá una foto para hacerla la principal, o la × para quitarla.</p>
  <div id="efotos" class="thumbs"></div>
  <div><label for="enuevas">Agregar fotos</label><input id="enuevas" type="file" accept="image/*" multiple></div>
  <div class="form">
    <div class="full"><label for="etitulo">Título</label><input id="etitulo"></div>
    <div><label for="ecategoria">Categoría</label><input id="ecategoria"></div>
    <div><label for="etalle">Talle</label><input id="etalle"></div>
    <div><label for="ecolor">Color</label><input id="ecolor"></div>
    <div><label for="eprecio">Precio ($)</label><input id="eprecio" type="number" inputmode="numeric"></div>
    <div class="full"><label for="edescripcion">Descripción</label><textarea id="edescripcion" rows="2"></textarea></div>
    <div><label for="elocal">Local de origen</label><select id="elocal"></select></div>
    <div><label for="ecosto">Costo ($)</label><input id="ecosto" type="number" inputmode="numeric"></div>
    <div class="full"><label for="egrupo">Grupo de mayoristas</label><input id="egrupo"></div>
    <div class="full"><label for="enotas">Notas</label><textarea id="enotas" rows="2"></textarea></div>
  </div>
  <p id="emsg" class="err"></p>
  <button id="eguardar">Guardar cambios</button>
  <button id="ecancelar" class="sec">Cancelar</button>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const c = window.CONFIG, db = supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num = v => v === '' ? null : Number(v);
let prendas = [];

async function comprimir(file) {
  const bmp = await createImageBitmap(file), s = Math.min(1, 1200 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas'); cv.width = bmp.width * s; cv.height = bmp.height * s;
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  return new Promise(r => cv.toBlob(r, 'image/jpeg', .8));
}

async function mostrar(logueada) {
  $('#login').classList.toggle('hidden', logueada);
  $('#app').classList.toggle('hidden', !logueada);
  if (logueada) { await cargarLocales(); await cargarPrendas(); }
}

async function cargarLocales() {
  const { data } = await db.from('locales').select('*').order('nombre');
  const ops = (data || []).map(l => `<option value="${l.id}">${esc(l.nombre)}</option>`).join('');
  $('#local').innerHTML = ops + '<option value="nuevo">+ Agregar local nuevo</option>';
  $('#flocal').innerHTML = '<option value="">Todos los locales</option>' + ops;
  $('#elocal').innerHTML = '<option value="">Sin asignar</option>' + ops;
  $('#nuevoLocal').classList.toggle('hidden', $('#local').value !== 'nuevo');
}

async function cargarPrendas() {
  const { data, error } = await db.from('prendas')
    .select('*, prendas_privado(costo, grupo, notas, local_id, locales(nombre))')
    .order('creada', { ascending: false });
  if (error) { $('#lista').textContent = 'Error al cargar: ' + error.message; return; }
  prendas = data; pintar(); resumen();
}

const priv = p => Array.isArray(p.prendas_privado) ? p.prendas_privado[0] : p.prendas_privado;

function pintar() {
  const fl = $('#flocal').value, fe = $('#festado').value;
  const l = prendas.filter(p => (!fl || String(priv(p)?.local_id) === fl) && (!fe || p.estado === fe));
  $('#lista').innerHTML = l.length ? l.map(p => {
    const x = priv(p) || {};
    return `<div class="row" data-id="${p.id}">
      <img src="${esc(p.fotos[0])}" alt="">
      <div class="info"><strong>${esc(p.titulo)}</strong>
        <div class="mut">${esc([p.talle && 'T. ' + p.talle, p.precio && '$' + p.precio].filter(Boolean).join(' · '))}</div>
        <div class="mut">Local: ${esc(x.locales?.nombre || 'sin asignar')}${x.costo ? ' · costo $' + x.costo : ''}${x.grupo ? ' · ' + esc(x.grupo) : ''}</div></div>
      <div class="acts">
        <select data-a="estado" aria-label="Estado">${['disponible','reservado','vendido'].map(e => `<option ${e === p.estado ? 'selected' : ''}>${e}</option>`).join('')}</select>
        <button class="sec" data-a="editar">Editar</button>
        <button class="sec" data-a="link">Copiar link</button>
        <button class="sec" data-a="enviar">Enviar</button>
        <button class="sec" data-a="borrar">Borrar</button>
      </div>
    </div>`;
  }).join('') : '<p class="mut">No hay prendas con esos filtros.</p>';
}

$('#entrar').onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email: $('#em').value, password: $('#pw').value });
  if (error) $('#lerr').textContent = 'Email o contraseña incorrectos.'; else mostrar(true);
};
$('#salir').onclick = async () => { await db.auth.signOut(); mostrar(false); };
$('#local').onchange = () => $('#nuevoLocal').classList.toggle('hidden', $('#local').value !== 'nuevo');
$('#flocal').onchange = $('#festado').onchange = pintar;
$('#rper').onchange = resumen;

$('#guardar').onclick = async () => {
  const msg = $('#gmsg'), files = [...$('#fotos').files], titulo = $('#titulo').value.trim();
  if (!files.length || !titulo) { msg.textContent = 'Falta al menos una foto y el título.'; return; }
  $('#guardar').disabled = true; msg.textContent = 'Subiendo fotos...';
  try {
    const urls = await subir(files);
    let localId = $('#local').value;
    if (localId === 'nuevo') {
      const nombre = $('#nuevoLocal').value.trim();
      if (!nombre) throw new Error('Escribí el nombre del local nuevo.');
      const r = await db.from('locales').insert({ nombre }).select().single();
      if (r.error) throw r.error; localId = r.data.id;
    }
    const { data, error } = await db.from('prendas').insert({
      titulo, categoria: $('#categoria').value.trim() || null, talle: $('#talle').value.trim() || null,
      color: $('#color').value.trim() || null, descripcion: $('#descripcion').value.trim() || null,
      precio: num($('#precio').value), fotos: urls }).select().single();
    if (error) throw error;
    const r2 = await db.from('prendas_privado').insert({
      prenda_id: data.id, local_id: localId ? Number(localId) : null, costo: num($('#costo').value),
      grupo: $('#grupo').value.trim() || null, notas: $('#notas').value.trim() || null });
    if (r2.error) throw r2.error;
    ['fotos','titulo','categoria','talle','color','precio','descripcion','costo','grupo','notas','nuevoLocal'].forEach(i => $('#' + i).value = '');
    msg.textContent = 'Prenda publicada.'; await cargarLocales(); await cargarPrendas();
  } catch (e) { msg.textContent = 'No se pudo guardar: ' + e.message; }
  $('#guardar').disabled = false;
};

$('#lista').addEventListener('change', async e => {
  if (e.target.dataset.a !== 'estado') return;
  const v = e.target.value;
  const { error } = await db.from('prendas').update({ estado: v, vendida_en: v === 'vendido' ? new Date().toISOString() : null }).eq('id', e.target.closest('.row').dataset.id);
  if (error) alert('No se pudo cambiar el estado: ' + error.message); await cargarPrendas();
});

$('#lista').addEventListener('click', async e => {
  const a = e.target.dataset.a; if (!a || a === 'estado') return;
  const id = e.target.closest('.row').dataset.id, p = prendas.find(x => x.id === id);
  if (a === 'editar') return abrirEdicion(p);
  const link = new URL('index.html?p=' + id, location.href).href;
  if (a === 'link') {
    try { await navigator.clipboard.writeText(link); e.target.textContent = 'Link copiado'; setTimeout(() => e.target.textContent = 'Copiar link', 2000); }
    catch { prompt('Copiá el link:', link); }
    return;
  }
  if (a === 'enviar') { window.open('https://wa.me/?text=' + encodeURIComponent(p.titulo + (p.precio ? ' - $' + p.precio : '') + '\n' + link), '_blank'); return; }
  if (a === 'borrar' && confirm('¿Borrar "' + p.titulo + '" y sus fotos?')) {
    await db.storage.from('fotos').remove(p.fotos.map(u => u.split('/').pop()));
    await db.from('prendas').delete().eq('id', id);
  }
  await cargarPrendas();
});

async function subir(files) {
  const urls = [];
  for (const f of files) {
    const path = crypto.randomUUID() + '.jpg';
    const { error } = await db.storage.from('fotos').upload(path, await comprimir(f), { contentType: 'image/jpeg' });
    if (error) throw error;
    urls.push(db.storage.from('fotos').getPublicUrl(path).data.publicUrl);
  }
  return urls;
}

const peso = n => '$' + Math.round(n).toLocaleString('es-AR');

function resumen() {
  const mes = $('#rper').value === 'mes', hoy = new Date(), por = {};
  prendas.forEach(p => {
    const x = priv(p) || {}, k = x.locales?.nombre || 'Sin asignar';
    const r = por[k] ??= { disp: 0, vend: 0, stock: 0, ventas: 0, gan: 0 };
    if (p.estado !== 'vendido') { r.disp++; r.stock += Number(x.costo || 0); return; }
    const d = p.vendida_en && new Date(p.vendida_en);
    if (mes && !(d && d.getMonth() === hoy.getMonth() && d.getFullYear() === hoy.getFullYear())) return;
    r.vend++; r.ventas += Number(p.precio || 0);
    if (x.costo != null) r.gan += Number(p.precio || 0) - Number(x.costo);
  });
  const filas = Object.entries(por).sort((a, b) => b[1].gan - a[1].gan);
  $('#resumen').innerHTML = '<tr><th>Local</th><th>En stock</th><th>Costo del stock</th><th>Vendidas</th><th>Ventas</th><th>Ganancia</th></tr>' +
    filas.map(([k, r]) => `<tr><td>${esc(k)}</td><td>${r.disp}</td><td>${peso(r.stock)}</td><td>${r.vend}</td><td>${peso(r.ventas)}</td><td>${peso(r.gan)}</td></tr>`).join('');
}

let ed = null;
function pintarFotosEdicion() {
  $('#efotos').innerHTML = ed.fotos.map((u, i) =>
    `<div class="th"><img data-i="${i}" src="${esc(u)}" alt="Foto ${i + 1}"><button data-i="${i}" aria-label="Quitar foto ${i + 1}">×</button></div>`).join('');
}
function abrirEdicion(p) {
  const x = priv(p) || {};
  ed = { id: p.id, fotos: [...p.fotos], originales: p.fotos };
  pintarFotosEdicion(); $('#enuevas').value = ''; $('#emsg').textContent = '';
  Object.entries({ etitulo: p.titulo, ecategoria: p.categoria, etalle: p.talle, ecolor: p.color, eprecio: p.precio,
    edescripcion: p.descripcion, ecosto: x.costo, egrupo: x.grupo, enotas: x.notas }).forEach(([k, v]) => $('#' + k).value = v ?? '');
  $('#elocal').value = x.local_id ?? '';
  $('#edlg').showModal();
}
$('#efotos').onclick = e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  if (e.target.tagName === 'IMG') ed.fotos.unshift(...ed.fotos.splice(Number(i), 1)); else ed.fotos.splice(Number(i), 1);
  pintarFotosEdicion();
};
$('#ecancelar').onclick = () => $('#edlg').close();
$('#eguardar').onclick = async () => {
  const t = $('#etitulo').value.trim(), msg = $('#emsg');
  if (!t) { msg.textContent = 'El título no puede quedar vacío.'; return; }
  $('#eguardar').disabled = true; msg.textContent = 'Guardando...';
  try {
    const fotos = [...ed.fotos, ...await subir([...$('#enuevas').files])];
    if (!fotos.length) throw new Error('La prenda necesita al menos una foto.');
    let r = await db.from('prendas').update({ titulo: t, categoria: $('#ecategoria').value.trim() || null, talle: $('#etalle').value.trim() || null,
      color: $('#ecolor').value.trim() || null, descripcion: $('#edescripcion').value.trim() || null, precio: num($('#eprecio').value), fotos }).eq('id', ed.id);
    if (r.error) throw r.error;
    r = await db.from('prendas_privado').upsert({ prenda_id: ed.id, local_id: $('#elocal').value ? Number($('#elocal').value) : null,
      costo: num($('#ecosto').value), grupo: $('#egrupo').value.trim() || null, notas: $('#enotas').value.trim() || null });
    if (r.error) throw r.error;
    const quitadas = ed.originales.filter(u => !fotos.includes(u));
    if (quitadas.length) await db.storage.from('fotos').remove(quitadas.map(u => u.split('/').pop()));
    $('#edlg').close(); await cargarPrendas();
  } catch (err) { msg.textContent = 'No se pudo guardar: ' + err.message; }
  $('#eguardar').disabled = false;
};

(async () => { const { data } = await db.auth.getSession(); mostrar(!!data.session); })();
</script>
</body>
</html>
