<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="wrap in">
  <a class="logo" id="negocio" href="./">Catálogo</a>
  <a class="btn wa sm" id="hwa" target="_blank" rel="noopener">Escribinos</a>
</div></header>
<main class="wrap">
  <section class="intro">
    <h1>Ropa disponible</h1>
    <p id="cuenta" class="mut">Cargando prendas...</p>
  </section>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por nombre o color" aria-label="Buscar">
    <select id="ftalle" aria-label="Talle"><option value="">Todos los talles</option></select>
  </div>
  <div id="chips" class="chips" role="group" aria-label="Categorías"></div>
  <div id="grid" class="grid"></div>
  <p id="vacio" class="mut hidden">No hay prendas con esos filtros. Probá quitar alguno.</p>
</main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const c = window.CONFIG, db = supabase.createClient(c.SUPABASE_URL, c.SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money = n => n ? '$' + Number(n).toLocaleString('es-AR') : 'Consultar';
let todas = [], cat = '';

document.title = c.NEGOCIO + ' · Catálogo'; $('#negocio').textContent = c.NEGOCIO;
$('#hwa').href = `https://wa.me/${c.WHATSAPP}?text=${encodeURIComponent('Hola! Quería consultar por la ropa.')}`;

function chips() {
  const cats = [...new Set(todas.map(p => p.categoria).filter(Boolean))].sort();
  $('#chips').classList.toggle('hidden', !cats.length);
  $('#chips').innerHTML = ['', ...cats].map(k =>
    `<button class="chip" data-c="${esc(k)}" aria-pressed="${k === cat}">${k ? esc(k) : 'Todo'}</button>`).join('');
}

function pintar() {
  const q = $('#q').value.toLowerCase(), t = $('#ftalle').value;
  const lista = todas.filter(p =>
    (!cat || p.categoria === cat) && (!t || p.talle === t) &&
    (!q || [p.titulo, p.color, p.descripcion].join(' ').toLowerCase().includes(q)));
  const fecha = todas[0] ? new Date(todas[0].creada).toLocaleDateString('es-AR', { day: 'numeric', month: 'long' }) : '';
  $('#cuenta').textContent = `${lista.length} ${lista.length === 1 ? 'prenda' : 'prendas'}` + (fecha ? ` · Última carga: ${fecha}` : '');
  $('#vacio').classList.toggle('hidden', lista.length > 0);
  $('#grid').innerHTML = lista.map(p => `
    <button class="card" data-id="${p.id}">
      <div class="ph"><img loading="lazy" src="${esc(p.fotos[0])}" alt="${esc(p.titulo)}">
        <span class="tag">${money(p.precio)}</span>
        ${p.estado === 'reservado' ? '<span class="badge">Reservado</span>' : ''}</div>
      <div class="tx"><h3>${esc(p.titulo)}</h3>
        <span class="mut">${esc([p.talle && 'Talle ' + p.talle, p.color].filter(Boolean).join(' · '))}</span></div>
    </button>`).join('');
}

function abrir(p) {
  const link = location.origin + location.pathname + '?p=' + p.id;
  const msg = `Hola! Me interesa: ${p.titulo}${p.talle ? ' (talle ' + p.talle + ')' : ''} - ${money(p.precio)}\n${link}`;
  $('#dlg').innerHTML = `
    <div class="fotos">${p.fotos.map(f => `<img src="${esc(f)}" alt="${esc(p.titulo)}">`).join('')}</div>
    <div class="dlg">
      <h2>${esc(p.titulo)}</h2>
      <strong>${money(p.precio)}</strong>
      <span class="mut">${esc([p.categoria, p.talle && 'Talle ' + p.talle, p.color].filter(Boolean).join(' · '))}</span>
      ${p.descripcion ? `<p>${esc(p.descripcion)}</p>` : ''}
      ${p.estado === 'reservado' ? '<p class="mut">Esta prenda está reservada.</p>' : ''}
      ${p.estado === 'vendido' ? '<p><strong>Esta prenda ya se vendió.</strong> Mirá el resto del catálogo.</p>' :
        `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${c.WHATSAPP}?text=${encodeURIComponent(msg)}">Consultar por WhatsApp</a>`}
      <button class="sec" onclick="$('#dlg').close()">Cerrar</button>
    </div>`;
  $('#dlg').showModal();
  history.replaceState(null, '', '?p=' + p.id);
}

$('#grid').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) abrir(todas.find(x => x.id === b.dataset.id)); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { cat = b.dataset.c; chips(); pintar(); } });
$('#dlg').addEventListener('close', () => history.replaceState(null, '', location.pathname));
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
['#q', '#ftalle'].forEach(s => $(s).addEventListener('input', pintar));

(async () => {
  const { data, error } = await db.from('prendas').select('*').neq('estado', 'vendido').order('creada', { ascending: false });
  if (error) { $('#cuenta').textContent = 'No se pudo cargar el catálogo. Probá de nuevo en unos minutos.'; return; }
  todas = data.filter(p => p.fotos.length);
  [...new Set(todas.map(p => p.talle).filter(Boolean))].sort().forEach(v => $('#ftalle').append(new Option(v, v)));
  chips(); pintar();
  const pid = new URLSearchParams(location.search).get('p');
  if (pid) { const r = await db.from('prendas').select('*').eq('id', pid).maybeSingle(); if (r.data && r.data.fotos.length) abrir(r.data); }
})();
</script>
</body>
</html>
